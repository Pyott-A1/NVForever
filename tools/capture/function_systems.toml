[function.GetLocked]
status = "match"
note = "Terminals now: 0 unloaded, 1 with lock data, 2 after Lock, 0 after Unlock [observed: probes]; doors and containers unchanged."

[function.GetLockLevel]
status = "match"
note = "Terminals: their difficulty (Easy 1), 5 after Lock 50, -1 after Unlock, 0 unloaded; a load door without lock data reads its other side's (255 at the gas station); 0 without a lock [observed: probes fp1, fp3, fp7]."
[function.Lock]
status = "match"
note = "On a terminal: locked at the level (at most 5), the terminal's own state, read by the opening [observed: probes; documented: GECK wiki Lock]."

[function.Unlock]
status = "match"
note = "On a terminal: it opens at its menu [documented: GECK wiki Unlock]; GetLocked 0, GetLockLevel -1 [observed: probes]."

[function.GetPCMiscStat]
status = "wrong"
system = "player statistics counters"
note = "The two names the shipped scripts ask for now count: Locations Discovered the found map markers [hypothesis, one data point], Times Addicted the addiction rolls. People Killed read 1 after a kill in the original [observed]; the codes of the other wiki names are not known, so no script can ask for them."

[function.RewardXP]
status = "match"
note = "Levelling by experience exists now (experience.rs, levelup.rs); the audit's gap is closed."

