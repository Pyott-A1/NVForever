note = "Chet (GSChetRef) is the nearest NPC in the general store; shot twice at 18-19 s (after the add-ons' start-up message boxes), the weapon put away at 22 s, shot again at 33-34 s and put away at 37 s; each shot aimed anew, as Chet moves"
