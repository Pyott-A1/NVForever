env = { NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_EQUIP = "0008F216", NVF_PLAY_TEST_GIVE = "0008ED02:24", NVF_PLAY_TEST_CONTROL = "3:weapon,4.5:reload,10.3:aimvats", NVF_PLAY_TEST_KEYS = "10:v,10.32:mouse-left,10.36:mouse-right,10.4:mouse-right" }
args = ["--cell", "Goodsprings", "--pos=-45600,65000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "000F573F,0013E5BB"]
run_seconds = 16
order = [[
  { re = 'vats mode: on \(WeapNV357Revolver', label = "V enters VATS mode" },
  { re = 'vats mode: marked .* mark 1;', label = "one mark" },
  { re = 'vats mode: unmarked .*, 0 marks left', label = "the right click takes it back" },
  { re = 'vats mode: off \(0 shots fired, 0 AP spent; right click with no marks\)', label = "a right click with no marks ends the mode" },
]]
expect = [
  { re = 'vats mode summary: entered 1 times, 1 marks, 0 shots, 0 AP spent', label = "nothing fired or spent" },
]
forbid = [{ re = 'vats mode: firing', label = "nothing is fired" }]

[[scenario]]
name = "vats-mode-ammo-limit"
source = "owner's todo 6: marks are limited by the rounds loaded as well as the AP (docs/design/vats-mode.md §7.2)"
note = "a .357 with one round (no god mode, so the magazine holds what is carried) among the Goodsprings dogs, left to their packages. The player's AP covers three 26 AP shots, so the second mark is refused for the rounds; E fires the one mark. V at 10 s, after the start-up boxes"
areas = ["combat", "vats"]
paths = ["engine/nvf-play/src/vats_mode.rs", "crates/fnv-combat/src/vats.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_EQUIP = "0008F216", NVF_PLAY_TEST_GIVE = "0008ED02:1", NVF_PLAY_TEST_CONTROL = "3:weapon,4.5:reload,10.3:aimvats,10.36:aimvats", NVF_PLAY_TEST_KEYS = "10:v,10.32:mouse-left,10.38:mouse-left,10.42:e" }
args = ["--cell", "Goodsprings", "--pos=-45600,65000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "000F573F,0013E5BB"]
run_seconds = 16
order = [[
  { re = 'vats mode: on \(WeapNV357Revolver, 26 AP a shot, 1 rounds loaded', label = "one round loaded" },
  { re = 'vats mode: marked .* mark 1;', label = "the first mark" },
  { re = 'vats mode: mark refused: No more rounds loaded\.', label = "the second mark is refused for the rounds" },
  { re = 'vats mode: off \(1 shots fired, 26 AP spent; all shots fired\)', label = "the one mark is fired" },
]]
name = "barber-menu"
source = "owner todo 6 task 2: ShowBarberMenu opens the character creator as the barber, the hair, its colour and the beard only (docs/spec-notes/character-creator.md §10)"
areas = ["chargen", "menus"]
paths = ["engine/nvf-play/src/creator.rs", "engine/nvf-play/src/creator/**", "crates/fnv-game/src/functions/misc.rs"]
# The console runs a script function only once the scripts run (about 7–9 s after launch,
# later when the add-ons' start-up boxes are slow): ShowBarberMenu at 14 s. --no-messages
# closes those OK-only boxes at once (a Classic Pack box at 13 s held the console step
# otherwise); the barber menu (1036) is no message box and stays open.
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "off", NVF_PLAY_TEST_CONSOLE = "14:ShowBarberMenu;14.3:close", NVF_PLAY_TEST_CREATOR = "17:next:Hair style,17.5:next:Facial hair,18:next:Hair colour,18.5:random,19:next:Origin,19.5:tab:face,21:done", NVF_PLAY_TEST_SHOTS = "16.5:barber_open.png,20:barber_changed.png" }
args = ["--cell", "GSDocMitchellHouse", "--play", "--no-voice", "--no-messages"]
run_seconds = 28
order = [[
  "console: > ShowBarberMenu",
  "script: menu 1036 open",
  "creator: open on",
  "creator: as the barber (ShowBarberMenu): the hair, its colour and the beard only",
  "creator: camera on opening: 58 units away, looking … under the eye (the hair)",
  "creator: Hair style",
  "creator: Facial hair",
  "creator: Hair colour",
  "creator: randomised",
  'test aid: creator: no row "Origin"',
  "creator: done (test aid NVF_PLAY_TEST_CREATOR)",
  "creator: closed",
]]
manual = "barber_open.png: the panel titled BARBER with one tab (HAIR) and no brows or sliders, the head framed; barber_changed.png: another hair, colour and beard"
