areas = ["renderer"]
paths = [
  "engine/nvf-assets/", "engine/nvforever/src/lod*.rs", "engine/nvforever/src/terrain.rs",
  "engine/nvforever/src/world*.rs", "engine/nvforever/src/grass*", "engine/nvforever/src/tree*",
  "engine/nvforever/src/water*", "engine/nvforever/src/imposters.rs", "engine/nvforever/src/reflection.rs",
  "engine/nvforever/src/emittance.rs", "engine/nvforever/src/underwater.rs", "engine/nvforever/src/ripples.rs",
  "engine/nvforever/src/particles.rs", "engine/nvforever/src/fly.rs", "engine/nvforever/src/main.rs",
  "crates/fnv-nif/", "crates/fnv-dds/", "crates/fnv-spt/", "crates/fnv-bsa/", "crates/fnv-vfs/",
  "crates/fnv-world/src/land.rs", "crates/fnv-world/src/grass.rs", "crates/fnv-world/src/imposter.rs",
  "crates/fnv-world/src/index.rs", "crates/fnv-world/src/placed.rs",
]
