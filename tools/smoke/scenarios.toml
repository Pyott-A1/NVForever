note = "the two Goodsprings dogs attack the player (no god mode); the player draws a lead pipe, holds Use 1.5 s at the nearest dog from 6 s (a power attack), then swings once more; the dogs and Violetta kill the player at about 10 s (its Death line)"
areas = ["combat", "dialogue"]
paths = ["crates/fnv-game/src/combat_lines.rs", "crates/fnv-game/src/combat.rs", "engine/nvf-play/src/voice.rs", "engine/nvf-play/src/combat.rs", "engine/nvforever/src/npc_combat.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_SCRIPT = "3:combat:0x000F573F:player,3:combat:0x0013E5BB:player", NVF_PLAY_TEST_EQUIP = "00004337", NVF_PLAY_TEST_CONTROL = "3:weapon,6:aimflat,6.1:fire,7.6:fire,8.4:aimflat,8.5:fire,8.6:fire" }
args = ["--cell", "Goodsprings", "--pos=-45600,65000,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "000F573F,0013E5BB"]
run_seconds = 22
expect = [
  { re = 'combat line: \S+ says PowerAttack line', label = "the player says a PowerAttack line" },
  { re = 'combat line: \S+ says Hit line', label = "someone says a Hit line" },
  { re = 'combat line: \S+ says Death line', label = "the player's Death line" },
  { re = 'combat lines: (?P<n>\d+) said', range = [2, 10000], label = "at least two combat lines in the summary" },
]

[[scenario]]
name = "combat-target-killed"
source = "owner's todo 6 item 1 (2026-10-17): after the player died near Violet she said a line; a fighter whose target died goes back to Normal and says CombatToNormal, never CombatToLost (Category:Detection, docs/spec-notes/combat-dialogue.md §5)"
note = "Violet (FiendVioletRef 0x000F570B, placed at -46910,64897) is set on the player, about 1,000 units from her, at 9 s; no god mode, the player's health set to 10 by the console at 8 s (once the scripts run) so her shots kill the player. Her GenericFiend CombatToNormal lines are written as if the player ran ('You're lucky I didn't find you.'): that is the data's text for the topic, not a Lost line"
areas = ["combat", "alert", "dialogue"]
paths = ["crates/fnv-game/src/awareness.rs", "crates/fnv-game/src/combat_lines.rs", "engine/nvforever/src/detection.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "1", NVF_PLAY_TEST_CONSOLE = "8:player.setav health 10;8.3:close", NVF_PLAY_TEST_SCRIPT = "9:combat:0x000F570B:player" }
args = ["--cell", "Goodsprings", "--pos=-45900,64896,7000", "--play", "--hour", "12", "--no-voice", "--no-messages", "--npc-packages", "FiendVioletRef"]
run_seconds = 30
expect = [
  "combat: the player died",
  { re = 'alert: \S*FiendViolet 000F570B Combat → Normal', label = "Violet goes from Combat to Normal once the player is dead" },
  { re = 'alert: \S*FiendViolet 000F570B says CombatToNormal line', label = "she says a CombatToNormal line" },
]
forbid = [
  { re = 'alert: \S*FiendViolet 000F570B Combat → Lost', label = "Violet loses a dead target" },
  { re = 'alert: \S*FiendViolet 000F570B says (CombatToLost|LostIdle|LostToNormal) line', label = "a Lost line about a dead target" },
]

