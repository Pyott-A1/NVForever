# ------------------------------------------------------------------ script stubs

[[scenario]]
name = "script-stubs"
kind = "tool"
source = "docs/design/script-stubs.md §1-§2: the audit of the stubbed script functions over the ten masters"
areas = ["scripts", "stubs"]
paths = ["crates/fnv-game/src/functions/mod.rs", "crates/fnv-game/src/functions/stubs.rs", "crates/fnv-game/src/functions/fighting.rs", "crates/fnvtool/src/script_cmd.rs"]
commands = [["script", "stubs", "{data}", "{masters}", "--schema", "schemas/fnv"]]
# The counts of script-stubs.md §1 (a function implemented later lowers them: update the
# doc's tables and these together). Karma and crime (claude/karma-crime) implemented six
# stubs (SendAssaultAlarm, SendTrespassAlarm, GetTrespassWarningLevel, IsTrespassing,
# GetAlarmed, GetMajorCrimeCount: 100 calls, 32 condition uses) and the unregistered GetIsAlignment.
# claude/script-stubs-2 implemented seven (34 calls, 9 condition uses), moved PushActorAway and
# SetForceSneak to "needs a system", and registered AddItemToLeveledList, IsDLCInstalled and
# claude/l5-npc-ai implemented SetForceSneak (3 calls): 77 stubs and 920 calls before it.
# GetXPForNextLevel (§3.2). Then four more (§3.3, §3.4): the followers' OpenTeammateContainer
# (26 calls, the last stub assigned to H, so no "H followers" row is left), Autosave (74 calls),
# the crafting ShowRecipeMenu (15 calls, PR #292) and claude/l5-render-fx's SwapTexture (383
# calls): 81 → 77 stubs, 1,418 → 920 calls, condition uses unchanged. Effect shaders
# (claude/effect-shaders, §3.6) implemented five more (PlayMagicShaderVisuals,
# StopMagicShaderVisuals, SetActorAlpha, SetSecuritronExpression, Reset3DState: 460 calls,
# no condition uses): 76 → 71 stubs, 917 → 457 calls.
# The combat round (§3.7) implemented eleven of the fifteen stubs assigned to E2 combat AI
# (144 calls, 132 condition uses) and moved the other four to "needs a system", so no
# "E2 combat AI" row is left: 71 → 60 stubs, 457 → 313 calls, 614 → 482 condition uses.
# claude/use-weapon implemented UseWeapon (13 calls, §3.8): 60 → 59 stubs, 313 → 300 calls.
# The script function audit implemented GetAnimAction (44 calls, 1 condition use, §3.9):
# 59 → 58 stubs, 300 → 256 calls, 482 → 481 condition uses.
# claude/blackjack implemented ShowBlackJackMenuParams (6 calls, §3.10): 58 → 57 stubs,
# 256 → 250 calls. claude/roulette implemented ShowRouletteMenuParams (6 calls): 57 → 56,
# 250 → 244. The function probes (script-function-coverage.md §4) implemented
# GetDisposition, SetDisposition, IsFacingUp and IsLeftUp (2 calls, 78 condition uses,
# observed in game): 56 → 52 stubs, 244 → 242 calls, 481 → 403 condition uses.
# claude/package-errands implemented the four used-item functions (GetIsUsedItem,
# GetIsUsedItemType, GetIsUsedItemEquipType, GetUsedItemActivate: 26 condition uses,
# §3.12): 52 → 48 stubs, 403 → 377 condition uses.
# claude/npc-unconscious implemented GetOwnerLastTarget (5 calls, the last stub assigned to J,
# so no "assigned" or "J karma and crime" row is left; docs/spec-notes/unconscious.md §2.8):
# 48 → 47 stubs, 242 → 237 calls.
# claude/repair-services-menu implemented ShowRepairMenu (15 calls, docs/spec-notes/repair.md):
# 47 → 46 stubs, 237 → 222 calls.
# claude/vats-mode implemented GetVATSValue (250 condition uses) and GetVATSMode (2 calls,
# 2 condition uses) for VATS mode (docs/design/vats-mode.md §12): 46 → 44 stubs,
# 222 → 220 calls, 377 → 125 condition uses.
expect = [
  { json = "summary.stubs", equals = 44 },
  { json = "summary.by_status.implementable", equals = 1 },
  { json = "summary.by_status.needs_system", equals = 43 },
  { json = "summary.by_status.no_op", equals = 4 },
  { json = "summary.stub_calls", equals = 220 },
  { json = "summary.stub_condition_uses", equals = 125 },
  { json = "summary.unhandled_used", equals = 1 },
]

