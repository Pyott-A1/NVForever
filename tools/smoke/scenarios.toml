args = ["--cell", "GSDocMitchellHouse", "--play", "--no-voice", "--hour", "14", "--sun-shadows", "--log-frame-times", "4", "--graphics-cycle", "vanilla;no-sun-shadows"]
run_seconds = 30
order = [[
  "GSDocMitchellHouseIntDoorREF activated",
  "sky: outdoors again, the sky dome (with the sun disc and glare) shown",
]]
expect = [
  "sun shadows to 8000 in 3 cascades",
  "sun shadows off",
  { re = 'Arms shade light for view: \[(?P<n>\d+)\]', range = [1, 80], label = "the arms' shade light draws at most 80 casters (about 190 when it was the sun's first cascade)" },
]

[[scenario]]
name = "shadow-probe"
source = "engine/nvforever/src/shadow_probe.rs (playtest list 4 item 5, the first-person shadow flicker): the debug probe NVF_PLAY_DEBUG_SHADOWS runs and finds no stretched skin, lost joint, wrong skin slot or moved mesh outside Doc Mitchell's house in first person with a weapon out, and the hidden third-person body stays body-sized"
areas = ["renderer", "player-body"]
paths = ["engine/nvforever/src/shadow_probe.rs", "engine/nvforever/src/player_body.rs"]
env = { NVF_PLAY_DEBUG_SHADOWS = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_EQUIP = "000E3778", NVF_PLAY_TEST_CONTROL = "8:weapon", NVF_PLAY_TEST_LOOK = "10:90:-12,13:180:-12,16:270:-30,19:0:-5,22:90:-12" }
args = ["--cell", "Goodsprings", "--pos=-69698,2246,8500", "--play", "--no-voice", "--hour", "14", "--sun-shadows"]
run_seconds = 30
expect = [
  "shadow probe: on (NVF_PLAY_DEBUG_SHADOWS)",
  { re = 'shadow probe: \d+ skins; stretched 0 big near casters 0 wrong skin slots 0 .* old place 0; joints gone or at the origin 0;', min = 3, label = "summaries with nothing found" },
  { re = 'shadow probe: (skin of|cascade \d casts|.* is drawn (with|from))', count = 0, label = "no single finding" },
  { re = 'player body joints within (?P<n>\d+)', range = [30, 300], label = "the hidden body measured body-sized (about 70)" },
  { re = 'player body joints within ([3-9]\d\d|\d{4,})', count = 0, label = "the hidden body never wider than 300" },
]

