source = "owner playtest list 4 item 4: message box buttons whose conditions fail are not shown (Doc Mitchell's chemistry set and broken 9mm SMG need Science / Repair 25; the player has 15)"
areas = ["messages", "menus"]
paths = ["crates/fnv-game/src/functions/misc.rs", "engine/nvf-play/src/script_hud.rs", "engine/nvf-play/src/script_events.rs"]
