note = "--no-messages added 2026-10-16 (claude/l5-combat-fixback-2): the jump at 11 s fell while one of the add-on packs' start-up message boxes was open (16.32 to 16.60 s of wall time, the press at 16.49), so it was ignored and the player jumped 0 times; with it the boxes close on the frame they open, as in ui-sounds and house-items. Expectations unchanged"
args = ["--cell", "Goodsprings", "--play", "--no-voice", "--no-messages", "--pos=-69850,5700,8650"]
run_seconds = 40
expect = [
  # Left Back Foot anywhere in the creatures' list (fixed 2026-10-16, claude/l5-combat-fixback-2):
  # the check wanted it first, but the list keeps no fixed order: when the young bighorner bites
  # back once its attack clip's Auxiliary 2 key can sort first. A wrong check fixed, not
  # loosened: the footstep sound is still required.
  { re = 'anim sounds summary:.*creatures: \d+ sounds \([^)]*\bLeft Back Foot \d+', label = "creature footsteps (Left Back Foot) among the creatures' sounds" },
  # 3 or 4 since playtest list 5 item 16 (claude/l5-combat-fixback, 2026-10-16): the hits
  # land on the body part capsules, and a shot that meets the turning bighorner's head
  # does double damage, so it can die on the fourth hit (3 hit sounds and the death), as
  # in the run of that day (Torso, Head, Torso, Torso), or the fifth.
  { re = 'anim sounds summary:.*\b[34] hits, 1 deaths', label = "3 or 4 hits and the death" },
  { re = 'anim sounds summary:.*the player jumped 1 and landed 1 times' },
  { re = 'ambient summary:.*random', label = "a source heard with some random sounds played" },
  { re = 'shot fx:.*casing knocks heard' },
]

