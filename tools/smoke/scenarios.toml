[[scenario]]
name = "falling-loading"
source = "playtest list 4 items 8, 9, 10, 2-3 (physics.md §6.4.2, docs/design/loading-screen.md §1): leaving the Goodsprings gas station the loading screen waits for the arrival's own cells and the player stands (no jump loop or landing after it); running down the owner's steep road at heading 150 keeps the ground; walking residents are drawn between physics steps"
note = "Ringo greets at about 4 s and the door at 5 s waits for that conversation to end; --no-dialogue-look keeps the view on the door whether the greeting comes before or after the 4 s face aid (with the view turned to Ringo the door was behind the player and never used, run 2026-10-16); the hill run is at 40-50 s (heading 150 left the ground for 22 steps before the fix, `fnvtool phys walk`)"
areas = ["physics", "loading", "player-body", "ai"]
paths = ["crates/fnv-phys/src/character.rs", "engine/nvforever/src/player_body.rs", "engine/nvforever/src/world.rs", "engine/nvf-play/src/loading.rs", "engine/nvf-play/src/phys.rs", "engine/nvforever/src/nav.rs"]
env = { NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_FACE = "4:0010903F", NVF_PLAY_TEST_ACTIVATE = "5", NVF_PLAY_TEST_GOTO = "40:-64168:-8679:7737", NVF_PLAY_TEST_LOOK = "40.5:150:0,44:150:0", NVF_PLAY_TEST_MOVE = "45:1:0,50:0:0" }
args = ["--cell", "GSGasStation", "--play", "--no-voice", "--hour", "9", "--npc-packages", "all", "--no-dialogue-look"]
run_seconds = 53
order = [[
  "travel to worldspace 000DA726 (WastelandNV)",
  "loading screen down after",
  "test aid: go to (-64168, -8679, 7737)",
]]
expect = [
  { re = 'player body summary: (?P<n>\d+) falls', range = [0, 0], label = "no jump loop: not after the door, not running down the road" },
  { re = 'player body summary: \d+ falls \(the jump loop\), (?P<n>\d+) landings', range = [0, 0], label = "no landing played" },
  { re = 'walk summary: .* (?P<n>\d+) stops of 1-3 frames', range = [0, 5], label = "walking residents do not flicker between walking and standing" },
]

[[scenario]]
