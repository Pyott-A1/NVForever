args = ["--cell", "GSDocMitchellHouse", "--play", "--no-voice"]
run_seconds = 12
order = [[
  { re = 'script: message GSChemistrySetMsg .* \(hidden by their conditions: \[1, 2\]\)' },
  { re = 'message box shown: .* \["Leave it alone\."\]$' },
  { re = 'script: message GSBrokenSMGMsg .* \(hidden by their conditions: \[1\]\)' },
]]

[[scenario]]
name = "goodbye-after-caravan"
kind = "tool"
source = "owner playtest list 4 item 22: Johnson Nash's topic list ends with a Goodbye; a Goodbye line with an end script (CaravanOffer) does not hold the generic GOODBYE back (fnv-game dialogue.rs build_choices)"
